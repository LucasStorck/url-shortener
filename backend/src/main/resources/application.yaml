spring:
  application:
    name: url-shortener
  docker:
    compose:
      file: ../compose.yaml
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      timeout: 200ms
      connect-timeout: 200ms
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  health:
    redis:
      enabled: false